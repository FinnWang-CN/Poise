name: bodylog
description: Offline-first body weight and body fat tracker.
publish_to: none
version: 0.8.4+22
environment:
  sdk: '>=3.7.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  excel: ^4.0.6
  file_picker: ^8.3.7
  health: 13.1.3
  http: ^1.3.0
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.6
  shared_preferences: ^2.5.2
  fl_chart: ^0.70.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
flutter:
  uses-material-design: true
  assets:
    - assets/brand/qingheng.png
    - assets/integrations/keep.jpg
    - assets/support/author.png
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.otf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/qingheng.png
  adaptive_icon_background: '#176E66'
  adaptive_icon_foreground: assets/brand/qingheng.png
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/brand/qingheng.png
    background_color: '#176E66'
    theme_color: '#176E66'
